<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111722" />
    <title>Choreon — Physics Playground</title>
  </head>
  <body>
    <div id="playground">
      <header class="playground-bar">
        <a class="brand" href="/">CHOREON</a>
        <span class="bar-divider"></span>
        <strong>PHYSICS PLAYGROUND</strong>
        <span class="bar-spacer"></span>
        <span id="renderer-state" class="state-chip">RENDERER STARTING</span>
        <span id="physics-wasm" class="state-chip">PHYSICS LOADING</span>
        <button id="pause" type="button" disabled>Pause</button>
        <button id="step" type="button" disabled>Step</button>
        <button id="raycast" type="button" disabled>Raycast</button>
      </header>
      <main class="playground-main">
        <canvas id="playground-canvas" aria-label="Physics simulation viewport"></canvas>
        <section class="help-panel">
          <strong>Move the sphere</strong>
          <span>W A S D · Space to jump</span>
          <span>Pause the simulation or advance one fixed step.</span>
          <output id="raycast-result" aria-live="polite">Raycast not run</output>
        </section>
      </main>
      <footer class="playground-footer">
        <span id="playground-status" data-testid="playground-status">INITIALIZING</span>
        <span>Fixed step · 60 Hz</span>
        <span class="footer-spacer"></span>
        <span id="player-position">PLAYER X 0.00 · Z 0.00</span>
        <span id="body-count">0 bodies</span>
      </footer>
    </div>
    <script type="module" src="/src/physics-playground.ts"></script>
  </body>
</html>
