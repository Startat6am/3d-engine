name: CI
on:
  push:
    branches: [main, feat/glb-import-texture-stress]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Temporary inspect of storage test formatting
        run: |
          pnpm exec prettier --write packages/engine-project-storage/src/index.test.ts
          git diff -- packages/engine-project-storage/src/index.test.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Animation pose evaluation benchmark
        run: pnpm --filter @engine/animation bench:pose
      - name: GLB import stress benchmark (geometry)
        env:
          GLB_STRESS_MAX_PEAK_RSS_DELTA_MIB: 128
        run: node --expose-gc benchmarks/glb-import-stress.mjs
      - name: GLB import stress benchmark (embedded image)
        env:
          GLB_STRESS_TEXTURE_BYTES: 16777216
          GLB_STRESS_MAX_PEAK_RSS_DELTA_MIB: 128
        run: node --expose-gc benchmarks/glb-import-stress.mjs
      - name: Voxel world stress benchmark
        run: |
          mkdir -p benchmark-results
          node benchmarks/voxel-world-stress.mjs > benchmark-results/voxel-world-stress.json
          cat benchmark-results/voxel-world-stress.json
      - name: Upload voxel benchmark results
        if: always() && hashFiles('benchmark-results/voxel-world-stress.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: voxel-world-stress-results
          path: benchmark-results/voxel-world-stress.json
          retention-days: 30
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
