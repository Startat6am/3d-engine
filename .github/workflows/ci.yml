name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: GLB import stress benchmark (geometry)
        run: node --expose-gc benchmarks/glb-import-stress.mjs
      - name: GLB import stress benchmark (embedded image)
        env:
          GLB_STRESS_TEXTURE_BYTES: 16777216
        run: node --expose-gc benchmarks/glb-import-stress.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
